[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-engine"
version = "0.1.0"
description = "Reproducible correctness and performance benchmark engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyYAML==6.0.3",
]

[project.scripts]
bench = "benchmark_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
